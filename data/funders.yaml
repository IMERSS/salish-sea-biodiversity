# Acknowledgement of partners and funders shown below a project's or dataset's entry on the Projects or Data page, keyed
# by its id in data/projects.json or data/datasets.json. `partners`, `acknowledgements` and `thanks` are sentences naming partners, others to thank,
# and funders, and `logos` lists keys from data/logos.yaml, of which `featuredLogo` may name one to set larger on a row
# of its own. Every member is optional. The acknowledgement of the
# peoples in whose territories a project takes place belongs to its place, in projects.json.
saanich-peninsula-flora:
  partners: >-
    This project is undertaken in partnership with Paige Erickson-Mcgee of
    [Habitat Acquisition Trust](https://hat.bc.ca/) and Cara Gibson of
    [Swan Lake Nature Sanctuary](https://www.swanlake.bc.ca/).
  acknowledgements: >-
    We especially thank Ian Cruickshank, Matt Fairbarns, Frank Lomer, Terry Ludwar, Andy MacKinnon, Adam Martin, Emma
    Menchions, James Miskelly, and Kristen Miskelly for their direct contributions.
  thanks: >-
    We are grateful for funding provided by the [Sitka Foundation](https://sitkafoundation.org/), the
    [Capital Regional District](https://www.crd.ca/), [Nature Victoria](https://naturevictoria.ca/), and
    [Keefer Ecological Services Ltd.](https://keefereco.com/)
    in support of this project.
  logos: [hat, swan-lake, ciee, sitka, crd, nature-victoria, keefer]
xetthecum-ecocultural-mapping:
  partners: >-
    This work was guided by the Indigenous-led [Whiteswan Environmental](https://www.whiteswanenvironmental.org/)
    through its Spirit of the Sxwo’le (SOS) Coalition, a cross-cultural community of practice grounded in protocols of
    respect and reciprocity.
  thanks: >-
    We are grateful for funding provided by the
    [Indigenous Watersheds Initiative](https://watershedsbc.ca/indigenous-watersheds-initiative/), the
    [Inclusive Design Research Centre](https://idrc.ocadu.ca/), the
    [Southern Gulf Islands Community Resource Centre](https://www.sgicommunityresources.ca/), and the
    [Capital Regional District](https://www.crd.ca/) in support of this ecocultural mapping pilot.
  logos: [iwi, idrc, whiteswan, sgi-crc, crd]
  featuredLogo: whiteswan
janszen-journal-5:
  acknowledgements: >-
    These records were transcribed through the
    [Living Data Project](https://www.ciee-icee.ca/ldp.html) of the
    [Canadian Institute of Ecology and Evolution](https://www.ciee-icee.ca/).
  logos: [ciee]
janszen-journal-8:
