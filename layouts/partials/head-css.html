{{- if and (not hugo.IsProduction) (eq hugo.Environment "theme") }}
  {{- $styles := resources.Get "css/styles.css" }}
  {{- $styles = $styles | postCSS (dict "inlineImports" true) }}
  <link href="{{ $styles.RelPermalink }}" rel="stylesheet" />
{{- else }}
  <!-- hextra's compiled CSS, served as-is from static/css/compiled/main.css so its filename stays stable -->
  <link href="{{ "css/compiled/main.css" | relURL }}" rel="stylesheet" />
{{- end }}


<!-- Custom CSS: served as-is from static/ so its filename stays stable -->
<link href="{{ "css/custom.css" | relURL }}" rel="stylesheet" />
