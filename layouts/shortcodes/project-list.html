{{- /* List of subsidiary projects, from the same data/projects.json that populates the map */ -}}
<div class="imerss-project-list">
{{- range site.Data.projects }}
  <div class="imerss-project-list-item">
    <h3><a href="{{ .siteUrl }}">{{ .title }}</a></h3>
    {{- /* The description's first heading repeats the title */ -}}
    {{ replaceRE `^#[^\n]*\n+` "" .description | markdownify }}
  </div>
{{- end }}
</div>
